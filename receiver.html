<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avertoo WebRTC Receiver</title>
</head>
<body>

<h2>Receiver</h2>

<button id="connect">Connect</button>
<button id="disconnect">Disconnect</button>
<button id="send">Send message</button>

<pre id="log"></pre>

<script type="module">

    import {Client} from
            "https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/+esm";


    const logElement =
        document.getElementById("log");


    const log = message => {

        logElement.textContent +=
            message + "\n";
    };


    const token =
        "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDAwMDAwMDAxIiwiaWF0IjoxNzkxMDE0OTgxLCJleHAiOjE3OTExMDEzODF9.dwR_OVV0fEDhlOwAejRGe935VN40ZaysCJ6rfuZOu8A";


    const targetUserId =
        1000000000;


    const client = new Client({

        brokerURL: "wss://scrubbed-immersion-reuse.ngrok-free.dev/ws",

        connectHeaders: {

            Authorization:
                "Bearer " + token
        },

        reconnectDelay: 5000,


        onConnect: () => {

            log("CONNECTED");


            client.subscribe(
                "/user/queue/signaling",
                message => {

                    handleSignalingMessage(
                        message
                    );
                }
            );


            heartbeatInterval =
                setInterval(() => {

                    if (!client.connected) {
                        return;
                    }


                    client.publish({

                        destination:
                            "/app/heartbeat",

                        body: ""
                    });


                    log(
                        "HEARTBEAT SENT " +
                        new Date()
                            .toLocaleTimeString()
                    );

                }, 20000);
        },


        onDisconnect: () => {

            log("DISCONNECTED");

            stopHeartbeat();
        },


        onStompError: frame => {

            log(
                "STOMP ERROR: " +
                frame.headers["message"]
            );

            log(frame.body);
        },


        onWebSocketError: error => {

            log("WEBSOCKET ERROR");

            console.error(error);
        }
    });


    let heartbeatInterval = null;


    let peerConnection = null;

    let dataChannel = null;


    const rtcConfiguration = {

        iceServers: [

            {
                urls:
                    "stun:stun.l.google.com:19302"
            }
        ]
    };


    function stopHeartbeat() {

        if (heartbeatInterval !== null) {

            clearInterval(
                heartbeatInterval
            );

            heartbeatInterval = null;
        }
    }


    function sendSignal(
        type,
        payload
    ) {

        client.publish({

            destination:
                "/app/signaling",

            body: JSON.stringify({

                targetUserId:
                targetUserId,

                type:
                type,

                payload:
                payload
            })
        });


        log(
            "SIGNAL SENT: " +
            type
        );
    }


    async function handleOffer(
        payload
    ) {

        log(
            "OFFER RECEIVED"
        );


        peerConnection =
            new RTCPeerConnection(
                rtcConfiguration
            );


        peerConnection.onicecandidate =
            event => {

                if (!event.candidate) {
                    return;
                }


                sendSignal(
                    "ICE_CANDIDATE",

                    JSON.stringify(
                        event.candidate
                    )
                );
            };


        peerConnection.onconnectionstatechange =
            () => {

                log(
                    "CONNECTION STATE: " +
                    peerConnection.connectionState
                );


                if (
                    peerConnection.connectionState ===
                    "connected"
                ) {

                    log(
                        "WEBRTC CONNECTED"
                    );
                }
            };


        peerConnection.oniceconnectionstatechange =
            () => {

                log(
                    "ICE STATE: " +
                    peerConnection.iceConnectionState
                );
            };


        peerConnection.ondatachannel =
            event => {

                dataChannel =
                    event.channel;


                log(
                    "DATA CHANNEL RECEIVED: " +
                    dataChannel.label
                );


                dataChannel.onopen =
                    () => {

                        log(
                            "DATA CHANNEL OPEN"
                        );


                        dataChannel.send(
                            "Hello from B!"
                        );


                        log(
                            "MESSAGE SENT: Hello from B!"
                        );
                    };


                dataChannel.onmessage =
                    event => {

                        log(
                            "MESSAGE RECEIVED: " +
                            event.data
                        );
                    };


                dataChannel.onclose =
                    () => {

                        log(
                            "DATA CHANNEL CLOSED"
                        );
                    };


                dataChannel.onerror =
                    error => {

                        log(
                            "DATA CHANNEL ERROR"
                        );

                        console.error(error);
                    };
            };


        const offer =
            JSON.parse(payload);


        await peerConnection.setRemoteDescription(
            offer
        );


        log(
            "OFFER APPLIED"
        );


        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        sendSignal(
            "ANSWER",

            JSON.stringify(
                peerConnection.localDescription
            )
        );


        log(
            "ANSWER CREATED"
        );
    }


    async function handleSignalingMessage(
        message
    ) {

        const signal =
            JSON.parse(message.body);


        log(
            "SIGNAL RECEIVED: " +
            signal.type
        );


        if (
            signal.type ===
            "OFFER"
        ) {

            try {

                await handleOffer(
                    signal.payload
                );

            } catch (error) {

                log(
                    "OFFER ERROR"
                );

                console.error(error);
            }


            return;
        }


        if (
            signal.type ===
            "ICE_CANDIDATE"
        ) {

            if (!peerConnection) {

                log(
                    "NO PEER CONNECTION"
                );

                return;
            }


            const candidate =
                JSON.parse(
                    signal.payload
                );


            try {

                await peerConnection.addIceCandidate(
                    candidate
                );


                log(
                    "ICE CANDIDATE APPLIED"
                );

            } catch (error) {

                log(
                    "ICE CANDIDATE ERROR"
                );

                console.error(error);
            }
        }
    }


    document
        .getElementById("connect")
        .addEventListener(
            "click",
            () => {

                if (!client.active) {

                    log(
                        "CONNECTING..."
                    );

                    client.activate();
                }
            }
        );


    document
        .getElementById("disconnect")
        .addEventListener(
            "click",
            () => {

                stopHeartbeat();


                if (dataChannel) {

                    dataChannel.close();

                    dataChannel = null;
                }


                if (peerConnection) {

                    peerConnection.close();

                    peerConnection = null;
                }


                client.deactivate();


                log(
                    "DISCONNECT REQUESTED"
                );
            }
        );


    document
        .getElementById("send")
        .addEventListener(
            "click",
            () => {

                if (
                    !dataChannel ||
                    dataChannel.readyState !==
                    "open"
                ) {

                    log(
                        "DATA CHANNEL NOT OPEN"
                    );

                    return;
                }


                const message =
                    "Hello from B!";


                dataChannel.send(
                    message
                );


                log(
                    "MESSAGE SENT: " +
                    message
                );
            }
        );

</script>

</body>
</html>
