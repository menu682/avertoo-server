spring.application.name=avertoo-server


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:avertoo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


spring.flyway.enabled=true


jwt.secret=${JWT_SECRET}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}


websocket.heartbeat-timeout-ms=${WEBSOCKET_HEARTBEAT_TIMEOUT_MS:60000}
websocket.heartbeat-check-interval-ms=${WEBSOCKET_HEARTBEAT_CHECK_INTERVAL_MS:10000}
websocket.server-id=${WEBSOCKET_SERVER_ID:server-1}
websocket.allowed-origin=${WEBSOCKET_ALLOWED_ORIGIN}


# Cloudflare Turnstile secret key.
# The real value will be provided through an environment variable.
avertoo.security.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# Registration rate limit.
avertoo.security.rate-limit.registration.max-attempts=20
avertoo.security.rate-limit.registration.window-seconds=600

# Login rate limit.
avertoo.security.rate-limit.login.max-attempts=10
avertoo.security.rate-limit.login.window-seconds=600